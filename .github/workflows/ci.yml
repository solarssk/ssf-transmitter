name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Upload coverage to Codecov
        # Fork and Dependabot workflows cannot read repository secrets; tests still run.
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: true

      - name: Check for unused/missing dependencies
        run: deptry .

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # Separate invocation: requirements.lock.txt is hash-pinned, and pip
      # requires ALL files in one `-r ... -r ...` invocation to be
      # hash-pinned once any of them are, so it can't be combined with the
      # loose ranges above. This is what the Dockerfile actually ships —
      # can diverge from requirements.txt; see the lock-freshness check
      # below.
      - name: Audit locked dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock.txt

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # requirements.lock.txt is what the Dockerfile actually installs
      # (`pip install --require-hashes`); requirements.txt only sets the
      # ranges dependabot bumps. If they drift, the image build still
      # succeeds — pinned to stale versions — while this check is the
      # only thing that would catch it. See AGENTS.md pitfalls table.
      - name: Verify requirements.lock.txt is up to date
        run: python scripts/lock_requirements.py --check

      - name: Build Docker image
        run: docker build -t ssf-transmitter:ci .

      # Build succeeding and passing the vulnerability scan below doesn't
      # prove the image actually runs — a broken CMD, entrypoint, or
      # runtime-missing dependency would sail through both unnoticed.
      # Boot it for real and hit the health endpoint.
      - name: Smoke test image (linux/amd64)
        run: |
          docker run -d --name smoke-amd64 -p 18000:8000 \
            -e SSF_CONTAINER_PORT=8000 \
            -e SSF_ISSUER=https://ssf.ci.invalid \
            -e SSF_BASE_URL=https://ssf.ci.invalid \
            -e SSF_WEBHOOK_TOKEN=ci-smoke-test-webhook-token-000000 \
            -e SSF_MANAGEMENT_TOKEN=ci-smoke-test-mgmt-token-0000000 \
            ssf-transmitter:ci
          ok=""
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:18000/jwks.json > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke-amd64
          docker rm -f smoke-amd64
          [ -n "$ok" ] || { echo "::error::container did not become healthy"; exit 1; }

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ssf-transmitter:ci
          format: cyclonedx
          output: sbom-cyclonedx.json
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          retention-days: 90

      # Print vulnerabilities in CI logs and fail on fixed HIGH/CRITICAL findings.
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ssf-transmitter:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      # docker-publish.yml ships linux/amd64 AND linux/arm64, but only
      # triggers on push to main/beta/tags — so without this, a PR that
      # breaks the arm64 build (e.g. a wheel or hash that only resolves
      # on amd64) merges clean and only fails *after* merge, in the real
      # publish job. Build and boot it here too, before merge.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Build Docker image (linux/arm64)
        run: docker buildx build --platform linux/arm64 --load -t ssf-transmitter:ci-arm64 .

      - name: Smoke test image (linux/arm64, emulated)
        run: |
          docker run -d --name smoke-arm64 --platform linux/arm64 -p 18001:8000 \
            -e SSF_CONTAINER_PORT=8000 \
            -e SSF_ISSUER=https://ssf.ci.invalid \
            -e SSF_BASE_URL=https://ssf.ci.invalid \
            -e SSF_WEBHOOK_TOKEN=ci-smoke-test-webhook-token-000000 \
            -e SSF_MANAGEMENT_TOKEN=ci-smoke-test-mgmt-token-0000000 \
            ssf-transmitter:ci-arm64
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18001/jwks.json > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke-arm64
          docker rm -f smoke-arm64
          [ -n "$ok" ] || { echo "::error::container did not become healthy"; exit 1; }
