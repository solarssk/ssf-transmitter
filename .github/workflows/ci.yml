name: CI

on:
  # Scoped to main/beta: pull_request already covers every push to an open
  # PR branch — an unscoped `push:` here would run the whole job a second
  # time for the same commit on every PR push (double the CI cost, and two
  # differently-named-but-identical "Test and lint" check runs where a
  # transient failure in one looks like a real problem even though the
  # other passed). Feature branches without an open PR simply don't need CI
  # until one is opened.
  push:
    branches: [main, beta]
  pull_request:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # SonarCloud's scan below needs full history (not the default
          # shallow clone) to attribute new-vs-existing code by git blame.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # requirements.lock.txt / requirements-dev.lock.txt are what the
      # Dockerfile and this job's own dependency install actually use
      # (`pip install --require-hashes`); requirements.txt /
      # requirements-dev.txt only set the ranges dependabot bumps. If they
      # drift, both installs still succeed — pinned to stale versions —
      # while this check is the only thing that would catch it. See
      # AGENTS.md pitfalls table.
      - name: Verify lock files are up to date
        run: python scripts/lock_requirements.py --check

      # --only-binary :all: rules out arbitrary setup.py execution;
      # --require-hashes verifies every downloaded artifact against
      # requirements-dev.lock.txt (this job always runs on ubuntu-latest,
      # a fixed platform, so a single-platform lock is enough here). No
      # separate `pip install --upgrade pip` first — that installs pip
      # itself without a version/hash pin, which is exactly what this
      # step exists to avoid; actions/setup-python's bundled pip already
      # supports --require-hashes (a long-stable flag).
      - name: Install dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --require-hashes -r requirements-dev.lock.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      # rhysd/actionlint ships no first-party GitHub Action (no action.yml in
      # its repo, only a Go binary + checksums) — download the pinned release
      # and verify its checksum directly, the same discipline as the
      # hash-verified Python dependency installs above.
      - name: Install actionlint
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz

      - name: Lint GitHub Actions workflows
        run: ./actionlint -color .github/workflows/*.yml

      # --min-severity low: keep pure code-smell/style suggestions
      # (informational, e.g. "prefer `gh release` over an action") from
      # blocking CI, while still failing on any actual security finding.
      - name: Audit workflows for security issues
        run: zizmor --min-severity low .github/workflows/

      - name: Test
        run: pytest --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        # Fork and Dependabot workflows cannot read repository secrets; tests still run.
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: true

      # Test Analytics (flaky-test detection, failure/duration trends) needs the
      # JUnit report from every run, including failed ones — !cancelled() (not
      # success()) so this still uploads when pytest itself failed.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml
          flags: backend

      # CI-based analysis (sonar-project.properties), not SonarCloud's
      # Automatic Analysis — the two are mutually exclusive; Automatic
      # Analysis must stay off in the SonarCloud project settings or it
      # silently overrides this scan. Runs after Test above so coverage.xml
      # and junit.xml (sonar-project.properties' report paths) both exist.
      # Skipped on fork PRs, which can't read SONAR_TOKEN.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Check for unused/missing dependencies
        run: deptry .

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # Separate invocations: a hash-pinned file can't be combined with
      # loose ranges in one pip-audit/pip call (pip requires every file in
      # one `-r ... -r ...` invocation to be hash-pinned once any of them
      # are). These are what actually get installed — the Docker image and
      # this job itself — and can diverge from the ranges above; see the
      # lock-freshness check further up.
      - name: Audit locked dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Build Docker image
        run: docker build -t ssf-transmitter:ci .

      # Build succeeding and passing the vulnerability scan below doesn't
      # prove the image actually runs — a broken CMD, entrypoint, or
      # runtime-missing dependency would sail through both unnoticed.
      # Boot it for real and hit the health endpoint.
      - name: Smoke test image (linux/amd64)
        run: |
          docker run -d --name smoke-amd64 -p 18000:8000 \
            -e SSF_CONTAINER_PORT=8000 \
            -e SSF_ISSUER=https://ssf.ci.invalid \
            -e SSF_BASE_URL=https://ssf.ci.invalid \
            -e SSF_WEBHOOK_TOKEN=ci-smoke-test-webhook-token-000000 \
            -e SSF_MANAGEMENT_TOKEN=ci-smoke-test-mgmt-token-0000000 \
            ssf-transmitter:ci
          ok=""
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:18000/jwks.json > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke-amd64
          [ -n "$ok" ] || { echo "::error::container did not become healthy"; exit 1; }

      # Exercises discovery, JWKS, the management API's stream CRUD, and the
      # webhook receiver over real HTTP against the container the previous
      # step just booted — catches things an in-process TestClient can't
      # (a broken CMD/entrypoint, the container's actual ASGI wiring, real
      # DNS resolution for SSRF checks, ...). See tests_e2e/conftest.py for
      # what this does and doesn't cover.
      - name: Run container E2E tests (linux/amd64)
        env:
          E2E_BASE_URL: http://localhost:18000
        run: pytest tests_e2e/ -v --no-cov

      - name: Stop smoke test container (linux/amd64)
        if: always()
        run: docker rm -f smoke-amd64

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ssf-transmitter:ci
          format: cyclonedx
          output: sbom-cyclonedx.json
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          retention-days: 90

      # Print vulnerabilities in CI logs and fail on fixed HIGH/CRITICAL findings.
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ssf-transmitter:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      # docker-publish.yml ships linux/amd64 AND linux/arm64, but only
      # triggers on push to main/beta/tags — so without this, a PR that
      # breaks the arm64 build (e.g. a wheel or hash that only resolves
      # on amd64) merges clean and only fails *after* merge, in the real
      # publish job. Build and boot it here too, before merge.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build Docker image (linux/arm64)
        run: docker buildx build --platform linux/arm64 --load -t ssf-transmitter:ci-arm64 .

      - name: Smoke test image (linux/arm64, emulated)
        run: |
          docker run -d --name smoke-arm64 --platform linux/arm64 -p 18001:8000 \
            -e SSF_CONTAINER_PORT=8000 \
            -e SSF_ISSUER=https://ssf.ci.invalid \
            -e SSF_BASE_URL=https://ssf.ci.invalid \
            -e SSF_WEBHOOK_TOKEN=ci-smoke-test-webhook-token-000000 \
            -e SSF_MANAGEMENT_TOKEN=ci-smoke-test-mgmt-token-0000000 \
            ssf-transmitter:ci-arm64
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18001/jwks.json > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke-arm64
          docker rm -f smoke-arm64
          [ -n "$ok" ] || { echo "::error::container did not become healthy"; exit 1; }
