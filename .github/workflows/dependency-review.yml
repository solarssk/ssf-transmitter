name: Dependency Review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # contents: write is required by the dependency-snapshot submission step
    # below (the GitHub Dependency Submission API treats a snapshot POST as
    # a repository write) — see
    # https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/use-dependency-submission-api
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Trivy's pip analyzer only recognizes a file literally named
      # requirements.txt, and only entries with an exact `==` pin — our
      # actual requirements.txt uses `>=`/`<` ranges (for humans and the
      # Docker build) and requirements-dev.lock.txt has the pins but the
      # wrong filename, so Trivy silently finds zero language files against
      # either as checked in (verified locally). requirements-dev.lock.txt
      # is a strict superset of requirements.lock.txt at identical resolved
      # versions (every runtime pin also appears, unchanged, in the dev
      # lock — verified, zero conflicts), so copying just that one file
      # under the name Trivy expects covers both runtime and dev/test
      # dependencies without needing two scans (which would otherwise
      # collide: Trivy assigns the manifest key from the scanned file's
      # basename, so two differently-scoped requirements.txt files
      # submitted separately can't be told apart in the snapshot history).
      - name: Prepare resolved dependency manifest for snapshot submission
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /tmp/dependency-snapshot-src
          cp requirements-dev.lock.txt /tmp/dependency-snapshot-src/requirements.txt

      # Without this, dependency-review-action below falls back to a plain
      # manifest diff (requirements*.txt / pyproject.toml as checked in),
      # which misses resolved transitive versions. Submitting a resolved
      # snapshot for this commit lets it compare precise dependency data
      # instead. Fork PRs get a read-only GITHUB_TOKEN regardless of the
      # `contents: write` above, so this only runs for same-repo PRs — same
      # guard as the PR-comment step below.
      - name: Submit dependency snapshot
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: /tmp/dependency-snapshot-src
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      # For a fork PR, GITHUB_TOKEN is downgraded to read-only regardless of
      # the `pull-requests: write` above — posting/updating the PR comment
      # would fail with a permission error and take the whole check down
      # with it, even on a clean scan. The scan itself still always runs;
      # only the comment is conditional on same-repo (non-fork) PRs.
      #
      # retry-on-snapshot-warnings: the snapshot submitted just above can
      # take a few seconds to become queryable — without this, a fast run
      # could still hit the "no snapshot found" warning it was added to fix.
      - name: Scan dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
          retry-on-snapshot-warnings: true
