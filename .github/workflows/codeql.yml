name: CodeQL

on:
  push:
    branches: [main, beta]
  pull_request:
  schedule:
    # Weekly, independent of any push — catches new CodeQL query-pack
    # findings against code that hasn't otherwise changed.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # "actions" covers the workflow YAML itself (overlaps with zizmor
        # in ci.yml, which is faster and Actions-specific; CodeQL's queries
        # differ and are cheap to also run here).
        language: [python, actions]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
