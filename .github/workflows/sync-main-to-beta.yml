name: Sync main → beta

# After every push to main (releases, hotfixes), merge main back into beta
# so the next release branch never has conflicts.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    name: Merge main into beta
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Credential is set explicitly on the remote right before the one
          # step that pushes, instead of being left in .git/config (readable
          # by any step in this job) for the whole job's duration.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Check beta branch exists
        id: beta
        run: |
          if git ls-remote --exit-code origin refs/heads/beta >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch beta does not exist; skipping sync."
          fi

      - name: Merge main into beta
        if: steps.beta.outputs.exists == 'true'
        run: |
          git checkout beta
          git merge origin/main --no-edit -m "chore: sync main into beta after release"
          git -c http.https://github.com/.extraheader="Authorization: Basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            push origin beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
