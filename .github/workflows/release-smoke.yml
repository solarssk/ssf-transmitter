name: Release smoke test

# Pulls the just-published GHCR image at the release tag (not a fresh local
# build — the whole point is verifying the artifact that actually shipped)
# and runs tests_e2e/ against it. Always dispatched by docker-publish.yml's
# merge-and-publish job, once it confirms the image is actually published —
# including for the emergency signed-tag path (scripts/release-tag.sh),
# where docker-publish.yml's own `push: tags:` trigger fires it. This
# workflow has no `push: tags:` trigger of its own: firing directly on a tag
# push would race docker-publish.yml's build/push time, since nothing then
# guarantees the image is pullable yet.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke-test (e.g. v0.5.11)
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-smoke-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test published image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No pip cache here (unlike ci.yml): this workflow's trigger includes a
      # tag push, which zizmor flags as a cache-poisoning-sensitive context —
      # and a release smoke test runs rarely enough that the cache's speed
      # gain isn't worth carrying that surface.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Install test dependencies (hash-locked)
        run: |
          uv export --locked --no-dev --extra test --no-emit-project -o /tmp/requirements-test.txt
          pip install --no-cache-dir --only-binary :all: --require-hashes -r /tmp/requirements-test.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same token values as ci.yml's pre-merge smoke test (and
      # tests_e2e/conftest.py's own defaults) — the E2E tests below
      # authenticate with those defaults unless overridden, so the container
      # has to be configured to match rather than the other way around.
      - name: Pull and run published image
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${TAG#v}"
          docker run -d --name release-smoke -p 18000:8000 \
            -e SSF_CONTAINER_PORT=8000 \
            -e SSF_ISSUER=https://ssf.release-smoke.invalid \
            -e SSF_BASE_URL=https://ssf.release-smoke.invalid \
            -e SSF_WEBHOOK_TOKEN=ci-smoke-test-webhook-token-000000 \
            -e SSF_MANAGEMENT_TOKEN=ci-smoke-test-mgmt-token-0000000 \
            "ghcr.io/${{ github.repository }}:${TAG#v}"
          ok=""
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:18000/jwks.json > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs release-smoke
          [ -n "$ok" ] || { echo "::error::published image did not become healthy"; exit 1; }

      - name: Run container E2E tests
        env:
          E2E_BASE_URL: http://localhost:18000
        run: pytest tests_e2e/ -v --no-cov

      - name: Verify graceful shutdown
        run: |
          docker stop --time 10 release-smoke
          docker logs release-smoke 2>&1 | grep -F 'SSF delivery outbox worker stopped'

      - name: Stop smoke test container
        if: always()
        run: docker rm -f release-smoke
