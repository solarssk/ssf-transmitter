name: Sync Wiki

# After docs/ or SECURITY.md changes land on main, mirror the relevant
# docs/*.md pages into the GitHub Wiki (a separate git repo:
# <repo>.wiki.git) via scripts/sync-wiki.py. See that script's own header
# comment for the exact file-to-page mapping and why docs/README.md is
# deliberately excluded (it would clobber Home.md's hand-curated content).
#
# Pushing to a repo's own Wiki only needs `contents: write` on the parent
# repo (verified against a real, working implementation elsewhere in this
# org) — no extra secret to create or rotate. `github.token` embedded
# directly in the wiki remote's HTTPS URL authenticates the clone/push in
# one line, simpler than the extraheader technique sync-main-to-beta.yml
# uses for its own second push (that one exists because a job needs to
# clone/push the *parent* repo itself under a second ref, where a bare
# token-in-URL on the already-checked-out origin remote isn't an option).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "SECURITY.md"
      - "scripts/sync-wiki.py"
      - ".github/workflows/sync-wiki.yml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out wiki
        env:
          WIKI_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: git clone --depth 1 "$WIKI_REMOTE" wiki

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync docs into wiki checkout
        run: python3 scripts/sync-wiki.py wiki

      - name: Commit and push wiki changes
        working-directory: wiki
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
