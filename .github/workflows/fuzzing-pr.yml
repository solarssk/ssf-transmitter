name: ClusterFuzzLite PR fuzzing

# Fuzzes every PR for up to 10 minutes using the harnesses under fuzz/ (see
# .clusterfuzzlite/'s Dockerfile/build.sh for the build side). "code-change"
# mode quits on the first crash and only reports crashes not already present
# on main — see fuzzing-batch.yml for the scheduled, longer-running,
# report-everything counterpart.
on:
  pull_request:
    paths:
      - "app/security/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzzing-pr.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fuzz:
    name: Fuzz changed code (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: "code-change"
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
