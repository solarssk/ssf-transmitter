version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # init/analyze (codeql.yml) must be the same version, or CodeQL
      # fails with "Loaded a configuration file for version X, but
      # running version Y"; upload-sarif (scorecard.yml) is bundled in
      # too since all three are always released together upstream.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Keep Docker base image up to date (digest bumps)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Keep Python dependencies up to date
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Group all non-security updates into a single PR to reduce noise
    groups:
      python-dependencies:
        patterns:
          - "*"
