version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # init/analyze (codeql.yml) must be the same version, or CodeQL
      # fails with "Loaded a configuration file for version X, but
      # running version Y"; upload-sarif (scorecard.yml) is bundled in
      # too since all three are always released together upstream.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      # build_fuzzers/run_fuzzers (fuzzing-pr.yml, fuzzing-batch.yml) are
      # released together upstream — same reasoning as codeql-action above.
      clusterfuzzlite-action:
        patterns:
          - "google/clusterfuzzlite/*"

  # Keep Docker base image up to date (digest bumps)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Same, for the ClusterFuzzLite fuzzer build image — a separate directory
  # entry since Dependabot's docker ecosystem doesn't scan recursively.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # atheris, hash-pinned in the fuzz image's own requirements file.
  - package-ecosystem: "pip"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # atheris 3.1+ ships only cp312+ wheels; the OSS-Fuzz Python base image
    # runs 3.11, so #171's bump to 3.1.0 failed with "No matching
    # distribution". Lift this once the base image's Python catches up.
    ignore:
      - dependency-name: "atheris"
        versions: [">=3.1"]

  # Keep Python dependencies up to date. pyproject.toml holds the ranges;
  # Dependabot recognizes the pip-compile-generated requirements.txt next to
  # it and regenerates the hashes there itself.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Group all non-security updates into a single PR to reduce noise
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pydantic-core is a hash-locked transitive dependency (via fastapi ->
    # pydantic) that pydantic pins to an *exact* version. Dependabot keeps
    # proposing standalone pydantic-core bumps whenever a newer release
    # lands on PyPI, but pip-compile always reverts them because no
    # published pydantic release supports that pydantic-core version yet —
    # this broke the "Verify requirements.txt matches pyproject.toml" CI
    # job on every weekly PR that included it (#149, #155, #160). It will
    # move again automatically, in lockstep with pydantic, once pydantic
    # itself needs the newer pydantic-core and pip-compile re-resolves both
    # together.
    ignore:
      - dependency-name: "pydantic-core"
