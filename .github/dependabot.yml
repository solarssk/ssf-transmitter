# Every entry carries a cooldown: a version published minutes ago is the one
# most likely to be a compromised release that gets pulled within days, so
# Dependabot waits before proposing it. Security updates ignore the cooldown,
# so a real fix is never delayed by it (zizmor: dependabot-cooldown).
version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      # init/analyze (codeql.yml) must be the same version, or CodeQL
      # fails with "Loaded a configuration file for version X, but
      # running version Y"; upload-sarif (scorecard.yml) is bundled in
      # too since all three are always released together upstream.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      # build_fuzzers/run_fuzzers (fuzzing-pr.yml, fuzzing-batch.yml) are
      # released together upstream — same reasoning as codeql-action above.
      clusterfuzzlite-action:
        patterns:
          - "google/clusterfuzzlite/*"

  # Keep Docker base image up to date (digest bumps)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  # Same, for the ClusterFuzzLite fuzzer build image — a separate directory
  # entry since Dependabot's docker ecosystem doesn't scan recursively.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  # atheris, hash-pinned in the fuzz image's own requirements file.
  - package-ecosystem: "pip"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    # atheris 3.1+ ships only cp312+ wheels; the OSS-Fuzz Python base image
    # runs 3.11, so #171's bump to 3.1.0 failed with "No matching
    # distribution". Lift this once the base image's Python catches up.
    ignore:
      - dependency-name: "atheris"
        versions: [">=3.1"]

  # uv resolves runtime and every tooling extra together in one native lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
