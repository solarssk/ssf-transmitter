[project]
name = "ssf-transmitter"
# Source of truth for the release-automation pipeline (.github/workflows/release.yml,
# scripts/generate-release-notes.py, scripts/sync-release-docs.py) — bumped as part of
# a release PR's "release: vX.Y.Z" commit. Not otherwise read at runtime; the running
# app's own reported version comes from the APP_VERSION build-arg (Dockerfile), set
# from the git tag at image build time.
version = "0.5.10"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under is a local backstop below Codecov's own project/patch
# gates (see codecov.yml): it fails fast, offline, on any PR/fork run where
# the Codecov token isn't available, rather than silently passing. Set a
# few points under the current ~77% baseline so routine coverage noise
# doesn't flap it — Codecov's 1% project-drop threshold is the real gate.
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=74"
pythonpath = ["."]
markers = [
    "no_dns_mock: skip the autouse mock_dns_resolve fixture (for tests that set up their own mocks)",
    "enable_rate_limit: keep slowapi enabled for rate-limit behaviour tests",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.deptry]
# DEP003 (transitive dependency used directly) requires full pyproject.toml
# dependency declaration to work correctly — skip it until dependencies are
# migrated from requirements.txt to [project.dependencies].
# DEP001 (missing) and DEP002 (unused) are still enforced.
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
# uvicorn is not imported in Python code — it is invoked as a CLI entrypoint
# in the Dockerfile CMD. Deptry cannot detect CLI-only runtime dependencies.
DEP002 = ["uvicorn"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# S (flake8-bandit): security-relevant patterns (hardcoded secrets, weak
# hashes/crypto, subprocess/exec misuse, ...).
# ASYNC: blocking calls inside async functions.
# RUF: ruff's own additional checks (mutable class-attribute defaults,
# implicit Optional, pyproject.toml validity, ...).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert): bare `assert` is the correct, idiomatic way to write a
# pytest assertion — the rule exists to flag `assert` in *production* code
# (stripped by python -O, so unsafe to rely on for real checks).
# S105/S106/S107 (possible hardcoded password): every one of the 40+
# matches here is a fake token/secret used to verify it does *not* leak —
# see tests/test_database_security.py — not a real credential.
"tests/*" = ["S101", "S105", "S106", "S107"]
"tests_e2e/*" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["app"]
# Default (non-strict) rule set — already catches genuine bugs with zero
# false positives on this codebase (verified). `--strict` surfaces ~47
# more findings, mostly mechanical (bare `dict`/`list` generics needing
# type args, a handful of missing return annotations) — real but sizeable
# enough to land as its own follow-up rather than folding into this one.
warn_unused_ignores = true
warn_redundant_casts = true
